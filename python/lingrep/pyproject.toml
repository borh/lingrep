[build-system]
requires = ["maturin>=1.12,<2"]
build-backend = "maturin"

[project]
name = "lingrep"
dynamic = ["version"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
description = "Japanese tokenization with Vibrato and corpus search with lingrep"
readme = "README.md"

[project.scripts]
lingrep = "lingrep.__main__:main"

[project.urls]
Repository = "https://github.com/borh/lingrep"

[tool.maturin]
python-source = "python"
module-name = "lingrep._native"

[project.optional-dependencies]
arrow = ["pyarrow>=14"]
polars = ["polars>=1.32"]

[dependency-groups]
dev = ["mypy", "typing-extensions"]

[tool.uv]
exclude-newer = "P3D"
cache-keys = [
    { file = "pyproject.toml" },
    { file = "README.md" },
    { file = "LICENSE" },
    { file = "python/**/*.py" },
    { file = "python/**/*.pyi" },
    { file = "python/lingrep/py.typed" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../../Cargo.toml" },
    { file = "../../Cargo.lock" },
    { file = "../../rust-toolchain.toml" },
    { file = "../../lingrep-core/Cargo.toml" },
    { file = "../../lingrep-core/src/**/*" },
    { file = "../../lingrep-cli-common/Cargo.toml" },
    { file = "../../lingrep-cli-common/src/**/*.rs" },
    { file = "../../nix/dictionary-licenses/**/*" },
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "spacy.*", "stanza.*"]
ignore_missing_imports = true
