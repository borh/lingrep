[project]
name = "lingrep-stanza-adapter"
version = "0.1.0"
description = "Generic Stanza morphology adapter for lingrep"
requires-python = ">=3.14,<3.15"
dependencies = [
    "blake3>=1.0.8,<2",
    "stanza==1.14.0",
]

[project.scripts]
lingrep-stanza-adapter = "lingrep_stanza_adapter.__main__:main"

[project.optional-dependencies]
# download.pytorch.org publishes the accelerator-suffixed builds for Linux and
# Windows only. darwin has a single build, unsuffixed, on PyPI -- so there the
# extra names the same torch the default index already serves, and the
# `pytorch-cpu` source below is skipped for the same reason.
cpu = [
    "torch==2.13.0+cpu; sys_platform != 'darwin'",
    "torch==2.13.0; sys_platform == 'darwin'",
]
# stanza depends on torch directly, so the base environment resolves a torch
# even with no extra selected. Leaving cuda unmarked let that resolution pick
# an accelerator build on a platform that has none.
cuda = ["torch==2.13.0+cu126; sys_platform != 'darwin'"]
rocm = [
    "torch==2.13.0+rocm7.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "triton-rocm==3.7.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = ["ruff>=0.16.2,<1"]

[tool.uv]
# Keep this declared here rather than in a user-global ~/.config/uv/uv.toml:
# uv.lock records `exclude-newer-span`, and uv re-resolves when the active
# value does not match what the lock recorded. Untracked, `uv lock --check`
# passes only on the machine that wrote the lock.
exclude-newer = "P3D"
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }],
    [{ extra = "cpu" }, { extra = "rocm" }],
    [{ extra = "cuda" }, { extra = "rocm" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cuda", extra = "cuda" },
    { index = "pytorch-rocm", extra = "rocm" },
]
triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lingrep_stanza_adapter"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
