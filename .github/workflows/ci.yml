name: CI

# The lane `.githooks/pre-push` already runs, on a public runner, in the shell
# the repository documents. A green run here and a green push therefore mean the
# same thing, which is the property the previous workflows did not have: the one
# named "Tests" ran no tests at all.
#
# The workflow requires no secrets. The dictionary is downloaded from the public
# `unidic-202512` release, and nothing here reaches the maintainer's network.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fast:
    name: Fast lane (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # `devShells.ci`, the CWJ dictionary it exports (1.31 GB in the store) and
      # a cargo target directory have to fit on one runner. The image's preinstalled SDKs are the cheapest thing to
      # give up and nothing in this repository uses them.
      - name: Reclaim disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Fetch the dictionary
        run: nix build --no-link .#vibrato-dict-cwj

      - name: Check the CLI package source
        run: |
          source="$(nix eval --raw .#lingrep.src)"
          cmp python/spacy-adapter/requirements-ginza.txt "$source/python/spacy-adapter/requirements-ginza.txt"
          cmp python/stanza-adapter/requirements-cpu.txt "$source/python/stanza-adapter/requirements-cpu.txt"

      # The lane `.githooks/pre-push` already runs, in the shell the repository
      # documents. A green run here and a green push therefore mean the same
      # thing.
      - name: Fast lane
        run: nix develop .#ci --command ./ci.sh --fast

  macos:
    name: Build and package (Apple silicon)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # Plain cargo, not the dev shell: this job proves that the code, its
      # tests, the class workflow and the packaging path work on Apple silicon,
      # not the corpus lane, which runs in the job above.
      # rustup installs the toolchain `rust-toolchain.toml` names, the same one
      # the dev shells use, so a newer release cannot change this job's lints.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-ci

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build -p lingrep

      # The runner has Homebrew libraries a user's Mac may not; a link
      # against one passes every other step here.
      - name: Check the binary loads only system libraries
        run: scripts/check-release-linkage.sh target/debug/ling

      # The tests read the dictionary the dev shell exports elsewhere.
      - name: Install the dictionary
        run: |
          target/debug/ling dictionary install
          echo "LINGREP_DICTIONARY_PATH=$HOME/.local/share/lingrep/dictionaries/unidic-cwj-202512.dic" >> "$GITHUB_ENV"

      # The integration suite launches ling through util-linux `flock`. The
      # three skipped tests fail on a macOS host outside the dev shell, with
      # or without a terminal; that is not yet diagnosed.
      - name: Test
        run: |
          brew install util-linux
          PATH="$(brew --prefix util-linux)/bin:$PATH"
          cargo test --workspace --lib --bins
          cargo test -p lingrep --tests -- \
            --skip completions::generated_scripts_complete_real_commands_in_supported_shells \
            --skip terminal_safety::a_build_warning_written_during_transient_status_starts_on_an_erased_line \
            --skip terminal_safety::progress_output_follows_mode_format_delivery_and_terminals_without_changing_stdout

      # The scenario's JSONL export is about ten times slower in a debug
      # build, so the scenario runs against a release build.
      - name: Build the release binary
        run: cargo build --release -p lingrep

      # The Soranoha archives, verified against their pinned SHA-256 values.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/student-scenario
          key: student-scenario-texts-${{ hashFiles('scripts/student-scenario-texts.sha256') }}

      - name: Student scenario
        timeout-minutes: 15
        run: |
          python3 scripts/student-scenario.py target/release/ling "$RUNNER_TEMP/scenario" \
            --downloads "$HOME/.cache/student-scenario"

      # Packaging is worth running here because it is the only place the shell
      # script, `ling manpages` and the notices generator execute on a Mac, and
      # the release workflow would otherwise discover a macOS-only failure at
      # publication time.
      - name: Package and smoke the archive
        env:
          PROFILE_DIR: target/debug
        run: |
          scripts/package-release.sh aarch64-apple-darwin
          mkdir -p unpacked
          tar xzf dist/*.tar.gz -C unpacked
          ./unpacked/ling-*/bin/ling --version
          ./unpacked/ling-*/bin/ling check --patterns patterns/sfe.lx
