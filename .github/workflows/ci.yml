name: CI

# The lane `.githooks/pre-push` already runs, on a public runner, in the shell
# the repository documents. A green run here and a green push therefore mean the
# same thing, which is the property the previous workflows did not have: the one
# named "Tests" ran no tests at all.
#
# No secret is needed. The dictionary is downloaded from the public
# `unidic-202512` release, and nothing here reaches the maintainer's network.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fast:
    name: Fast lane (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # `devShells.ci`, the CWJ dictionary it exports (1.31 GB in the store) and
      # a cargo target directory have to fit on one runner. The image's preinstalled SDKs are the cheapest thing to
      # give up and nothing in this repository uses them.
      - name: Reclaim disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Fetch the dictionary
        run: nix build --no-link .#vibrato-dict-cwj

      # The lane `.githooks/pre-push` already runs, in the shell the repository
      # documents. A green run here and a green push therefore mean the same
      # thing.
      - name: Fast lane
        run: nix develop .#ci --command ./ci.sh --fast

  macos:
    name: Build and package (Apple silicon)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Plain cargo, not the dev shell: this job proves that the code and the
      # packaging path work on Apple silicon, not the corpus lane, which runs
      # in the job above.
      # rustup installs the toolchain `rust-toolchain.toml` names, the same one
      # the dev shells use, so a newer release cannot change this job's lints.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-ci

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build -p lingrep

      # The runner has Homebrew libraries a user's Mac may not; a link
      # against one passes every other step here.
      - name: Check the binary loads only system libraries
        run: scripts/check-release-linkage.sh target/debug/ling

      # `cargo test` is deliberately absent: `lingrep_core::testing::
      # dictionary_path()` panics when the variable the dev shell exports is
      # unset, so a dictionary-free run fails three tests for the environment
      # rather than for the change.
      #
      # Packaging is worth running here because it is the only place the shell
      # script, `ling manpages` and the notices generator execute on a Mac, and
      # the release workflow would otherwise discover a macOS-only failure at
      # publication time.
      - name: Package and smoke the archive
        env:
          PROFILE_DIR: target/debug
        run: |
          scripts/package-release.sh aarch64-apple-darwin
          mkdir -p unpacked
          tar xzf dist/*.tar.gz -C unpacked
          ./unpacked/ling-*/bin/ling --version
          ./unpacked/ling-*/bin/ling check --patterns patterns/sfe.lx
