name: Output filesystems

# Runs the output checks with input, output, and temporary paths on each
# filesystem in the matrix.

on:
  push:
    branches: [main]
    paths: &paths
      - "lingrep/**"
      - "lingrep-corpus/**"
      - "lingrep-web/**"
      - "lingrep-core/**"
      - "lingrep-cli-common/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - "scripts/check-output-filesystem.py"
      - ".github/workflows/filesystems.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:
  workflow_call:
    inputs:
      release-ref:
        description: Ref used to build the release archives in the calling workflow
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release-ref || github.ref }}
  cancel-in-progress: ${{ inputs.release-ref == '' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  build-linux:
    if: inputs.release-ref == ''
    name: Build ling (Linux)
    # The oldest supported Ubuntu, so that the binary also runs in the WSL
    # distribution below.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: filesystems
      - name: Build
        run: cargo build --locked -p lingrep --bin ling
      - uses: actions/upload-artifact@v7
        with:
          name: ling-linux
          path: target/debug/ling
          if-no-files-found: error
          retention-days: 3

  linux:
    name: Linux ${{ matrix.filesystem }}
    needs: build-linux
    if: ${{ !cancelled() && (inputs.release-ref != '' || needs.build-linux.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { filesystem: vfat, fstype: vfat }
          - { filesystem: exfat, fstype: exfat }
          - { filesystem: ntfs3, fstype: ntfs3 }
          - { filesystem: ntfs-3g, fstype: fuseblk }
          - { filesystem: ext4-casefold, fstype: ext4 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-ref || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.release-ref != '' && 'x86_64-unknown-linux-gnu' || 'ling-linux' }}
          path: bin
      - name: Unpack the release binary
        if: inputs.release-ref != ''
        run: |
          tar -xzf bin/*.tar.gz -C bin
          mv bin/ling-*/bin/ling bin/ling
      - name: Install filesystem tools and the dictionary
        run: |
          chmod +x bin/ling
          sudo apt-get update
          sudo apt-get install -y dosfstools exfatprogs ntfs-3g
          bin/ling dictionary install
      - name: Mount ${{ matrix.filesystem }}
        run: |
          image="$RUNNER_TEMP/filesystem.img"
          mountpoint="$RUNNER_TEMP/mnt"
          owner="uid=$(id -u),gid=$(id -g)"
          truncate -s 512M "$image"
          mkdir "$mountpoint"
          case "${{ matrix.filesystem }}" in
            vfat)
              mkfs.vfat "$image"
              sudo mount -t vfat -o "loop,$owner" "$image" "$mountpoint" ;;
            exfat)
              mkfs.exfat "$image"
              sudo mount -t exfat -o "loop,$owner" "$image" "$mountpoint" ;;
            ntfs3)
              mkntfs -F -Q "$image"
              sudo mount -t ntfs3 -o "loop,$owner" "$image" "$mountpoint" ;;
            ntfs-3g)
              mkntfs -F -Q "$image"
              # On a loop device, as on a USB disk, ntfs-3g mounts as fuseblk.
              sudo ntfs-3g -o "$owner" "$(sudo losetup --find --show "$image")" "$mountpoint" ;;
            ext4-casefold)
              mkfs.ext4 -q -O casefold "$image"
              sudo mount -o loop "$image" "$mountpoint"
              # Casefolding applies to the empty directories marked +F.
              sudo mkdir "$mountpoint/check"
              sudo chattr +F "$mountpoint/check"
              sudo chown "$(id -u):$(id -g)" "$mountpoint/check"
              lsattr -d "$mountpoint/check" | grep -q F ;;
          esac
          findmnt "$mountpoint"
          test "$(findmnt -n -o FSTYPE "$mountpoint")" = "${{ matrix.fstype }}"
      - name: Check ling on ${{ matrix.filesystem }}
        timeout-minutes: 10
        run: python3 scripts/check-output-filesystem.py "$RUNNER_TEMP/mnt/check" bin/ling

  build-macos:
    if: inputs.release-ref == ''
    name: Build ling (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: filesystems
      - name: Build
        run: cargo build --locked -p lingrep --bin ling
      - uses: actions/upload-artifact@v7
        with:
          name: ling-macos
          path: target/debug/ling
          if-no-files-found: error
          retention-days: 3

  macos:
    name: macOS ${{ matrix.personality }}
    needs: build-macos
    if: ${{ !cancelled() && (inputs.release-ref != '' || needs.build-macos.result == 'success') }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # `diskutil info` personalities; `APFS` is case-insensitive, as on a
        # default macOS installation.
        personality: [ExFAT, MS-DOS FAT32, APFS]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-ref || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.release-ref != '' && 'aarch64-apple-darwin' || 'ling-macos' }}
          path: bin
      - name: Unpack the release binary
        if: inputs.release-ref != ''
        run: |
          tar -xzf bin/*.tar.gz -C bin
          mv bin/ling-*/bin/ling bin/ling
      - name: Install the dictionary
        run: |
          chmod +x bin/ling
          bin/ling dictionary install
      # hdiutil intermittently fails with "Resource busy" on hosted runners
      # (actions/runner-images#7522), so each hdiutil call is retried.
      - name: Mount ${{ matrix.personality }}
        run: |
          retry() {
            for _ in 1 2 3 4 5; do
              "$@" && return 0
              sleep 3
            done
            return 1
          }
          image="$RUNNER_TEMP/filesystem.dmg"
          mountpoint="$RUNNER_TEMP/mnt"
          retry hdiutil create -quiet -ov -size 512m -fs "${{ matrix.personality }}" -volname LINGCHECK "$image"
          mkdir "$mountpoint"
          retry hdiutil attach -nobrowse -mountpoint "$mountpoint" "$image"
          diskutil info "$mountpoint" | grep -E 'Personality|Type \(Bundle\)'
          diskutil info "$mountpoint" | grep -qE "File System Personality: +${{ matrix.personality }}\$"
      - name: Check ling on ${{ matrix.personality }}
        timeout-minutes: 10
        run: python3 scripts/check-output-filesystem.py "$RUNNER_TEMP/mnt/check" bin/ling

  wsl:
    name: WSL 2 on drive C
    needs: build-linux
    if: ${{ !cancelled() && (inputs.release-ref != '' || needs.build-linux.result == 'success') }}
    runs-on: windows-2025
    # WSL 2 provisioning occasionally hangs on hosted runners
    # (actions/runner-images#14938) and step timeouts do not stop it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-ref || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.release-ref != '' && 'x86_64-unknown-linux-gnu' || 'ling-linux' }}
          path: bin
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
      - name: Check ling on /mnt/c
        timeout-minutes: 20
        shell: wsl-bash {0}
        env:
          WSLENV: GITHUB_WORKSPACE/p
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ ! -f bin/ling ]; then
            tar -xzf bin/*.tar.gz -C bin
            mv bin/ling-*/bin/ling bin/ling
          fi
          install -m 755 bin/ling ~/ling
          ~/ling dictionary install
          fstype="$(findmnt -n -o FSTYPE /mnt/c)"
          echo "/mnt/c: $fstype"
          case "$fstype" in 9p | drvfs) ;; *) exit 1 ;; esac
          python3 scripts/check-output-filesystem.py /mnt/c/ling-filesystem-check ~/ling
