name: Release

# Builds the downloadable `ling` archives for one tagged release and publishes
# them with their checksums. The tag is the release: `v0.3.0` requires
# docs/release-notes/v0.3.0.md and a binary that reports 0.3.0, and neither is
# discovered here.
#
# No dictionary is built or attached. `ling` tokenizes nothing without one, and
# a dictionary is licensed data with its own acquisition paths (README,
# DICTIONARIES.md); the archives carry MIT-licensed code and the generated
# third-party notices only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build; empty builds the dispatched branch
        required: false
        type: string
      # Tag pushes qualify for publication after all release checks pass.
      publish:
        description: Publish the release when every gate passes
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  advisories:
    uses: ./.github/workflows/dependency-advisories.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.tag || github.sha }}

  build:
    needs: advisories
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # One unavailable runner must not hide the other artifacts, so the matrix
      # reports per target. The publish job still requires every target.
      fail-fast: false
      matrix:
        include: &targets
          # An older glibc is the floor for the archive, so it is built on the
          # oldest still-supported Ubuntu runner.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # GitHub-hosted arm64 Linux runners. If the label moves, this line is
          # the only one that changes.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          # Intel Macs. GitHub's Intel macOS image; the linkage check below
          # applies to it as to the Apple silicon build.
          - target: x86_64-apple-darwin
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}

      # The toolchain is the one `rust-toolchain.toml` names.
      - name: Install the pinned toolchain
        run: rustup toolchain install && rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # sqlite is linked from the bundled source (`sqlx`'s `sqlite-bundled`), so
      # no system headers are involved and the runner requires no packages.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p lingrep
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols

      # The smoke gate requires no dictionary, so it runs on every target before
      # anything is packaged. A binary that cannot answer `--version` or parse
      # a tracked catalog fails the release here rather than in a user's shell.
      - name: Smoke the binary
        run: |
          binary="target/${{ matrix.target }}/release/ling"
          "$binary" --version
          "$binary" check --patterns patterns/sfe.lx
          python3 scripts/smoke-release-server.py "$binary"

      - name: Check the binary loads only system libraries
        run: scripts/check-release-linkage.sh "target/${{ matrix.target }}/release/ling"

      - name: Assert the version matches the tag
        if: github.event_name == 'push' || inputs.publish
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          expected="${tag#v}"
          binary="target/${{ matrix.target }}/release/ling"
          actual="$("$binary" --version | awk '{print $2}')"
          if [ "$actual" != "$expected" ]; then
            echo "error: tag is $tag but the binary reports $actual" >&2
            exit 1
          fi

      - name: Package
        env:
          PROFILE_DIR: target/${{ matrix.target }}/release
        run: scripts/package-release.sh "${{ matrix.target }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  # The class workflow at full-novel size against the uploaded archive, started
  # with a macOS login shell's soft open-file limit, which ling raises to the
  # hard limit. A failure on any target blocks publication.
  gate:
    name: Student scenario and Python wheel (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: *targets
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.target }}
          path: dist

      # The Soranoha archives, verified against their pinned SHA-256 values.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/student-scenario
          key: student-scenario-texts-${{ hashFiles('scripts/student-scenario-texts.sha256') }}

      - name: Unpack the archive and install the dictionary
        run: |
          mkdir unpacked
          tar xzf dist/*.tar.gz -C unpacked
          ling="$(echo "$PWD"/unpacked/ling-*/bin/ling)"
          echo "LING=$ling" >> "$GITHUB_ENV"
          "$ling" dictionary install

      - name: Run the student scenario
        if: runner.os != 'Linux' || runner.arch != 'X64'
        run: |
          python3 scripts/student-scenario.py "$LING" "$RUNNER_TEMP/scenario" \
            --downloads "$HOME/.cache/student-scenario"

      # 4 GiB is what an 8 GB laptop leaves for ling beside the OS and a
      # browser. The 5 GiB allocation first proves that the cgroup enforces the
      # cap without swap; the runner has 16 GB, so uncapped it would succeed.
      - name: Run the student scenario under a 4 GiB memory cap
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          capped() {
            sudo systemd-run --scope --quiet --uid="$(id -u)" --gid="$(id -g)" \
              --setenv=HOME="$HOME" --setenv=PATH="$PATH" \
              -p MemoryMax=4G -p MemorySwapMax=0 -- "$@"
          }
          if capped python3 -c 'b"x" * (5 << 30)'; then
            echo "error: the memory cap admitted a 5 GiB allocation" >&2
            exit 1
          fi
          capped python3 scripts/student-scenario.py "$LING" "$RUNNER_TEMP/scenario" \
            --downloads "$HOME/.cache/student-scenario"

      - name: Collect binding license notices
        run: |
          python3 scripts/third-party-notices.py --package lingrep-python --target "${{ matrix.target }}" \
            > python/lingrep/python/lingrep/THIRD-PARTY-NOTICES.md

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --manifest-path python/lingrep/Cargo.toml --out wheels

      - uses: astral-sh/setup-uv@v7
      - name: Test the installed bindings and type declarations
        run: |
          export PATH="${LING%/*}:$PATH"
          unset LINGREP_DICTIONARY_PATH
          wheels=(wheels/*.whl)
          wheel=${wheels[0]}
          for version in 3.10 3.14; do
            uv venv --clear --python "$version" "$RUNNER_TEMP/wheel-env"
            py="$RUNNER_TEMP/wheel-env/bin/python"
            uv pip install --python "$py" "$wheel"
            "$RUNNER_TEMP/wheel-env/bin/lingrep" tokenize '猫が眠る。' | "$py" -c 'import json,sys; assert json.load(sys.stdin) == ["猫", "が", "眠る", "。"]'
            "$py" -I -c 'from lingrep import Tokenizer; assert Tokenizer().tokenize("猫が眠る。") == ["猫", "が", "眠る", "。"]'
            uv pip install --python "$py" "${wheel}[polars,arrow]" mypy typing-extensions
            "$py" -I -c 'import polars, pyarrow'
            "$py" -m unittest discover -s python/lingrep/tests
            "$py" -m mypy --strict python/lingrep/tests/typing_usage.py python/lingrep/tests/typing_polars.py
            "$py" -c 'from importlib.metadata import version; import subprocess; assert version("lingrep") == subprocess.check_output(["ling", "--version"], text=True).split()[1]'
          done

      - uses: actions/upload-artifact@v7
        with:
          name: lingrep-wheel-${{ matrix.target }}
          path: wheels/*.whl
          if-no-files-found: error

  adapters:
    name: Python analyzer wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"
          python-version: "3.14"

      - name: Build and check the adapter wheels
        env:
          UV_EXCLUDE_NEWER: "P3D"
        run: |
          if [ "${{ github.event_name == 'push' || inputs.publish }}" = true ]; then
            set -- --tag "${{ inputs.tag || github.ref_name }}"
          fi
          python3 scripts/check-adapter-wheels.py --output dist "$@"

      - uses: actions/upload-artifact@v7
        with:
          name: python-adapters
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [build, gate, adapters]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The release notes are part of the tree, reviewed with the code, and
      # named by the tag. A tag without them is refused rather than published
      # with an empty body.
      - name: Collect notes and checksums
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          notes="docs/release-notes/$tag.md"
          if [ ! -s "$notes" ]; then
            echo "error: $notes is missing or empty" >&2
            exit 1
          fi
          mkdir -p release
          cp "$notes" release/notes.md
          # The installer installs this release by default, and SHA256SUMS
          # lists it with the archives.
          scripts/render-installer.sh "${tag#v}" dist/install.sh
          cd dist
          if command -v sha256sum > /dev/null; then
            sha256sum ./*.tar.gz ./*.whl ./install.sh > ../release/SHA256SUMS
          else
            shasum -a 256 ./*.tar.gz ./*.whl ./install.sh > ../release/SHA256SUMS
          fi
          cat ../release/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" \
            --title "lingrep ${tag#v}" \
            --notes-file release/notes.md \
            --verify-tag \
            ./dist/*.tar.gz ./dist/*.sha256 ./dist/*.whl ./dist/install.sh ./release/SHA256SUMS

  publish-pypi:
    name: Publish tested bindings to PyPI
    needs: publish
    if: vars.LINGREP_PYPI_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lingrep-wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
