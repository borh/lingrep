[workspace]

[package]
name = "lingrep-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.lingrep-core]
path = ".."

[[bin]]
name = "fuzz_patterns"
path = "fuzz_targets/fuzz_patterns.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_matcher"
path = "fuzz_targets/fuzz_matcher.rs"
test = false
doc = false
bench = false
