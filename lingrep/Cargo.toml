[package]
name = "lingrep"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Japanese corpus search on the command line: morphology, lingrep patterns matching, prepared corpora, and concordance output"

[[bin]]
name = "ling"
path = "src/main.rs"

[dependencies]
anstyle.workspace = true
blake3.workspace = true
lingrep-cli-common = { path = "../lingrep-cli-common" }
lingrep-core.workspace = true
lingrep-corpus = { path = "../lingrep-corpus" }
roaring = "0.10.6"
clap.workspace = true
clap_complete.workspace = true
clap_mangen = "0.3.0"
colorgrad.workspace = true
serde.workspace = true
serde_json.workspace = true
compact_str = { workspace = true }
indexmap.workspace = true
rustc-hash.workspace = true
schemars = "1.2.2"
thiserror.workspace = true
rand = "0.9"
rayon.workspace = true
tree-sitter = "0.26.11"
tree-sitter-lingrep.workspace = true
unicode-width = "0.2"
unicode-segmentation = "1"
terminal_size = "0.4"
vibrato-rkyv.workspace = true
signal-hook = "0.3.17"
tokio = { version = "1", features = ["rt-multi-thread"] }
ratatui = "0.30.2"
roff = "1.1.1"
crossterm = "0.29.0"
crossbeam-channel = "0.5.14"
lru.workspace = true
log.workspace = true
tempfile.workspace = true

num_cpus.workspace = true

[dev-dependencies]
assert_cmd = "2"
criterion = { version = "0.5", features = ["html_reports"] }
trycmd.workspace = true
lingrep-core = { workspace = true, features = ["testing"] }
jsonschema = { version = "0.49.5", default-features = false }
zstd = "0.13.1"
zip = { version = "7.2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dev-dependencies]
completest-pty = "1.1.0"
libc = "0.2"

[[bench]]
name = "scope_resolution"
harness = false

[[bench]]
name = "inline_lexicon_campaign"
harness = false

[lints]
workspace = true
