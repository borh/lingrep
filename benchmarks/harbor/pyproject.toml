[project]
name = "lingrep-harbor-eval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "harbor @ git+https://github.com/harbor-framework/harbor.git@b53b8134e1241686dca7759af188f987ecc48e8b",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-bash>=0.25,<0.26",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
exclude-newer = "3 days"
# GHSA-rfpc-qcw5-3pc4 and 12 other filelock advisories are fixed in 4.2.1;
# litellm 1.104 and later cap filelock below 4.
constraint-dependencies = ["filelock>=4.2.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not containers'"
markers = ["containers: runs Podman against the loaded benchmark images"]
