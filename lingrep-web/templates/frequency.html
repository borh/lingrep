{% extends "layout.html" %}
{% block title %}Frequencies{% endblock %}
{% block head %}
    <link rel="stylesheet" href="assets/frequency.css">
    <script type="module" src="assets/frequency.js"></script>
{% endblock %}
{% block content %}
<section class="fq" data-frequency>
  <div class="fq-head">
    <p class="fq-sentence" data-fq-sentence></p>
    <p class="fq-under"><span class="fq-figures" data-fq-figures></span></p>
    <div class="fq-clause" data-fq-clause></div>
    <div class="fq-source" data-fq-source></div>
  </div>
  <p class="fq-state" data-fq-state role="status"></p>
  <div data-fq-table></div>
  <div class="fq-entry" data-fq-entry hidden></div>
  <dialog class="reading-dialog reading-dialog-document" data-fq-reader aria-labelledby="document-reader-title">
    <header class="reading-dialog-header"><h2 id="document-reader-title" data-fq-reader-title></h2><button type="button" class="btn btn-secondary" data-fq-return></button></header>
    <div id="document-reader-body" class="reading-body" aria-live="polite"></div>
  </dialog>
</section>
{% endblock %}
