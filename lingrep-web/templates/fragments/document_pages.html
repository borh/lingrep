{% match earlier %}{% when Some with (block) %}<button type="button" class="doc-reader-more" data-reader-earlier hx-get="{{ root_url }}?blocks_before={{ block }}" hx-target="this" hx-swap="outerHTML" data-i18n="reading.earlier_text">Earlier text</button>{% when None %}{% endmatch %}
<div class="doc-reader-page" data-excluded="{{ excluded }}">{{ html|safe }}</div>
{% match later %}{% when Some with (block) %}<button type="button" class="doc-reader-more" data-reader-later hx-get="{{ root_url }}?blocks_from={{ block }}" hx-target="this" hx-swap="outerHTML" data-i18n="reading.later_text">Later text</button>{% when None %}{% endmatch %}
