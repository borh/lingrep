<header class="site{% if current_page != "frequencies" && current_page != "compare" %} site-wide{% endif %}">
    {{ crate::question_assets::site_routes(current_page, frequency_view.clone())|safe }}
    <span class="site-tools">
    {% if current_page == "corpus" %}
    <button type="button" class="editor-help-open" data-editor-help-open
            aria-haspopup="dialog" title="Syntax and shortcuts" data-i18n-title="editor.help_summary">
        <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false"><rect x="1" y="1" width="16" height="12" rx="2"/><path d="M4 4h1m3 0h1m3 0h1M4 7h1m3 0h1m3 0h1M5 10h8"/></svg>
        <span class="visually-hidden" data-i18n="editor.help_summary">Syntax and shortcuts</span>
    </button>
    {% endif %}
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to dark theme"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg></button>
    <button type="button" class="locale-toggle" data-locale-toggle aria-label="Switch language">日本語</button>
    </span>
</header>
