<section class="capture-inspection" hidden>
    <h4>{{ capture.name }}</h4>
    <dl>
        <dt><span data-i18n="capture.qualified_path">Qualified path</span></dt><dd>{{ capture.path }}</dd>
        <dt><span data-i18n="capture.token_range">Token range</span></dt><dd>{{ capture.span.start }}..{{ capture.span.end }}</dd>
        <dt><span data-i18n="capture.captured_text">Captured text</span></dt><dd>{{ capture.text }}</dd>
    </dl>
</section>
